.posts{gap:32px}
.post{background:#fff;color:var(--ox);text-decoration:none;border-radius:6px;padding:30px;display:flex;flex-direction:column;gap:14px;box-shadow:0 16px 32px rgba(58,15,18,.18);transition:transform .2s}

.path li{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:24px;padding:24px 0;border-top:1px solid var(--ox)}
.path li:last-child{border-bottom:1px solid var(--ox)}

.path li .d{grid-column:span 5;font-size:17px;line-height:1.5}

/* brands */

.brands p{font-weight:900;font-stretch:62%;font-size:clamp(40px,5vw,72px);line-height:1;text-transform:uppercase}
.after-brands{height:112px}

@media (max-width:700px){

  .flip-cta p{font-size:17px}
  .sub-btn{align-self:stretch;text-align:center;padding:18px 20px}
  .post{padding:24px}
  .post .ttl{font-size:28px}
  .r1,.r2,.r3{transform:none}
  .how,.path{padding-top:64px}

  .path li .t{font-size:34px}
  .path li .d{font-size:16px}
  .brands{margin-top:64px}
  .after-brands{height:64px}
}
